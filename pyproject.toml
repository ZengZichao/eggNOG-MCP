[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eggnog-mcp"
version = "0.1.0"
description = "An unofficial Model Context Protocol (MCP) server for the eggNOG database, providing orthology assignments and functional annotations for comparative genomics."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "eggNOG-MCP Contributors" }
]
keywords = [
    "eggnog",
    "mcp",
    "model-context-protocol",
    "orthology",
    "comparative-genomics",
    "bioinformatics",
    "annotation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5.0",
]

[project.scripts]
eggnog-mcp = "eggnog_mcp.server:main"

[project.urls]
Homepage = "https://eggnogdb.org/"
Repository = "https://github.com/ZengZichao/eggNOG-MCP"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
